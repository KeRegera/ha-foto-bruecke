name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # feste Version: dort ist das Android-SDK vorinstalliert
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK vorbereiten
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Kein vorinstalliertes SDK – wird heruntergeladen"
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk FotoBruecke.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Foto-Brücke Android-App (Build ${{ github.run_number }})
          body: |
            Auf dem Android-Handy herunterladen und installieren.
            Danach in Home Assistant → Foto-Brücke → Hochladen auf „App einrichten“ tippen.
          files: FotoBruecke.apk
          make_latest: true

name: Foto-Brücke
version: "1.0.0"
slug: foto_bruecke
description: Fotos vom Android hochladen und mit Aufnahmedatum und Ort aufs iPhone sichern
url: https://github.com/KeRegera/ha-foto-bruecke
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:image-sync
panel_title: Foto-Brücke
map:
  - type: media
    read_only: false
options:
  keep_days: 0
schema:
  keep_days: int(0,3650)
  timezone: str?

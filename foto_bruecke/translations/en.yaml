configuration:
  immich_url:
    name: Immich URL
    description: "Address of your Immich server, e.g. http://192.168.0.10:2283"
  immich_api_key:
    name: Immich API key
    description: "Create in Immich under Account Settings → API Keys (permissions: asset.read, asset.view, asset.download, album.read)."
  app_token:
    name: App key
    description: "Leave empty to generate automatically. Set up the Android app via the link in Foto-Brücke."
  keep_days:
    name: Retention (days)
    description: "Delete photos automatically after this many days. 0 = never."
  timezone:
    name: Time zone
    description: "Leave empty to use the Home Assistant time zone (e.g. Europe/Berlin)."
